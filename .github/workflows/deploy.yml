# Builds the static export, prints the PDFs, and deploys to Cloudflare Workers.
#
# Manual-only until you wire it up. To deploy on every push to `main`, add the
# two secrets below and uncomment the `push` trigger.
#
# Two secrets are needed: CLOUDFLARE_API_TOKEN, scoped to Workers Scripts: Edit,
# and CLOUDFLARE_ACCOUNT_ID.
#
# This is meant to replace a dashboard-connected build, not run beside one. The
# PDF step needs Chrome, which this runner carries and a Workers Builds image
# does not, so two connected builds would race and the one without a PDF could
# land second. Deploying somewhere other than Cloudflare? Swap the last step for
# that host's command and keep the rest.

name: Deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# A later push supersedes an in-flight deploy rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # `bunfig.toml` sets frozenLockfile, so this fails if `bun.lock` is stale.
      - run: bun install

      - run: bun run build

      # Chrome 150 is preinstalled on this image. Naming the path explicitly means
      # an image that drops it fails here with a clear message rather than
      # silently falling through to another browser.
      - run: bun run pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
